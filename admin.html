<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GJShop Admin</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#1c2944;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#142f7c;color:white;padding:19px}main{max-width:950px;margin:30px auto;padding:0 16px}section{background:white;border:1px solid #e0e7f3;border-radius:16px;padding:22px;margin-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:20px}label{display:block;font-size:13px;font-weight:750;margin:13px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd7e8;border-radius:9px;font:inherit}button{background:#2048a6;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:800;cursor:pointer}button.secondary{background:#eef2fb;color:#1d3f95}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.msg{color:#8c4920;font-size:14px;margin:14px 0}.item{border-bottom:1px solid #e4eaf4;padding:15px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.item small{color:#6a7993}.actions{display:flex;gap:8px}.hide{display:none}a{color:#234db1}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{display:block}.actions{margin-top:10px}}</style></head><body><header><h1>GJShop Admin</h1><small>Authorized managers only • <a style="color:white" href="/">Back to shop</a></small></header><main><p class="msg" id="status">Checking secure backend configuration…</p><section id="loginBox" class="hide"><h2>Admin sign in</h2><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Sign in</button></p></form></section><div id="dashboard" class="hide"><section><button class="secondary" id="logout">Sign out</button><h2>Manage product listings</h2><p>Only publish genuine product URLs and images you are permitted to use. Add affiliate URLs after approval.</p><form id="productForm"><input type="hidden" id="editId"><div class="grid"><div><label>Product title</label><input id="title" maxlength="160" required></div><div><label>Category</label><input id="category" maxlength="80" required></div><div><label>Retailer</label><input id="retailer" maxlength="80" required></div><div><label>Price in ₹ (optional; verify regularly)</label><input id="price" type="number" min="0" step=".01"></div></div><label>Product URL (HTTPS, affiliate link if approved)</label><input id="url" type="url" pattern="https://.*" required><label>Product photo URL (HTTPS, licensed image)</label><input id="image" type="url" pattern="https://.*"><label>Description</label><textarea id="description" rows="3"></textarea><p><label><input type="checkbox" id="published" style="width:auto"> Publish publicly</label></p><button type="submit">Save product</button> <button class="secondary" type="button" id="reset">Clear</button></form></section><section><h2>Product listings</h2><div id="list">Loading…</div></section></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const $=id=>document.getElementById(id),status=$('status');let db=null,rows=[];
async function start(){let config;try{const r=await fetch('/gjshop-config.json',{cache:'no-store'});if(!r.ok)throw Error('Missing config');config=await r.json();if(!config.supabaseUrl||!config.supabasePublishableKey)throw Error('Backend not configured')}catch{status.textContent='Admin backend is not connected yet. Set up a dedicated Supabase project and gjshop-config.json first.';return}
db=createClient(config.supabaseUrl,config.supabasePublishableKey);await check()}
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){$('loginBox').classList.remove('hide');$('dashboard').classList.add('hide');status.textContent='Sign in with your authorized admin account.';return}
const {data,error}=await db.from('gjshop_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();status.textContent='This account does not have admin permission.';$('loginBox').classList.remove('hide');return}
$('loginBox').classList.add('hide');$('dashboard').classList.remove('hide');status.textContent='Signed in as authorized admin.';await load()}
$('login').onsubmit=async e=>{e.preventDefault();if(!db)return;status.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){status.textContent=error.message;return}await check()};
$('logout').onclick=async()=>{await db.auth.signOut();await check()};
function reset(){$('productForm').reset();$('editId').value=''}$('reset').onclick=reset;
async function load(){const {data,error}=await db.from('gjshop_products').select('*').order('created_at',{ascending:false}).limit(200);if(error){status.textContent=error.message;return}rows=data||[];$('list').replaceChildren();if(!rows.length){$('list').textContent='No listings yet.';return}for(const p of rows){const div=document.createElement('div');div.className='item';const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=p.title;const small=document.createElement('small');small.textContent=' • '+p.category+' • '+p.retailer+' • '+(p.published?'Published':'Draft');info.append(strong,small);const actions=document.createElement('div');actions.className='actions';for(const [label,action] of [['Edit','edit'],['Delete','delete']]){const b=document.createElement('button');b.type='button';b.textContent=label;b.className=action==='edit'?'secondary':'';b.onclick=()=>action==='edit'?edit(p):remove(p);actions.append(b)}div.append(info,actions);$('list').append(div)}}
function edit(p){$('editId').value=p.id;$('title').value=p.title;$('category').value=p.category;$('retailer').value=p.retailer;$('price').value=p.price_inr??'';$('url').value=p.product_url;$('image').value=p.image_url??'';$('description').value=p.description??'';$('published').checked=p.published;window.scrollTo({top:0,behavior:'smooth'})}
async function remove(p){if(!confirm('Delete '+p.title+'?'))return;const {error}=await db.from('gjshop_products').delete().eq('id',p.id);status.textContent=error?error.message:'Product deleted';if(!error)await load()}
$('productForm').onsubmit=async e=>{e.preventDefault();const data={title:$('title').value.trim(),category:$('category').value.trim(),retailer:$('retailer').value.trim(),price_inr:$('price').value?Number($('price').value):null,product_url:$('url').value.trim(),image_url:$('image').value.trim()||null,description:$('description').value.trim()||null,published:$('published').checked,updated_at:new Date().toISOString()};const id=$('editId').value;const req=id?db.from('gjshop_products').update(data).eq('id',id):db.from('gjshop_products').insert(data);const {error}=await req;status.textContent=error?error.message:'Product saved successfully';if(!error){reset();await load()}};
start();
</script></body></html>
