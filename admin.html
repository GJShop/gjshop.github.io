<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GJShop | Secure Admin</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f5f7fc;color:#1c2a48}header{background:#153985;color:#fff;padding:18px}header a{color:#fff}main{max-width:920px;margin:26px auto;padding:0 15px}.panel{background:#fff;border:1px solid #e2e8f4;border-radius:16px;padding:21px;margin-bottom:18px}h1{margin:0;font-size:24px}h2{font-size:20px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea{font:inherit;border:1px solid #cbd6e8;border-radius:8px;padding:11px;width:100%}input[type=checkbox]{width:auto}button{font:inherit;font-weight:750;background:#2048a5;color:#fff;border:0;border-radius:8px;padding:11px 15px;cursor:pointer}.secondary{background:#eaf0fc;color:#21428c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.hidden{display:none}.msg{color:#795120}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e5e9f3}.item small{color:#788399}.actions{display:flex;gap:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{display:block}.actions{margin-top:8px}}</style></head><body><header><h1>GJShop Admin</h1><a href="/">← Shopping website</a></header><main><p id="status" class="msg">Checking Firebase configuration…</p><section class="panel hidden" id="loginPanel"><h2>Authorized Admin Login</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Sign in</button></p></form></section><div id="dashboard" class="hidden"><section class="panel"><button id="signout" class="secondary">Sign out</button><h2>Manage products</h2><p>Use only genuine product images you have rights to display. Enter affiliate links after retailer approval.</p><form id="productForm"><input type="hidden" id="editId"><div class="grid"><div><label>Product name</label><input id="title" maxlength="160" required></div><div><label>Category</label><input id="category" maxlength="80" required></div><div><label>Retailer</label><input id="retailer" maxlength="80" required></div><div><label>Price ₹ (optional)</label><input id="price" type="number" min="0" step=".01"></div></div><label>Product URL (https://)</label><input id="url" type="url" pattern="https://.*" required><label>Licensed image URL (https://)</label><input id="image" type="url" pattern="https://.*"><label>Description</label><textarea id="description" rows="3"></textarea><p><label><input id="published" type="checkbox"> Publish on website</label></p><button>Save product</button> <button type="button" id="clear" class="secondary">Clear</button></form></section><section class="panel"><h2>Product listings</h2><div id="list"></div></section></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,collection,getDocs,query,limit,addDoc,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let auth,db,items=[];
function message(t){$('status').textContent=t}
function reset(){$('productForm').reset();$('editId').value=''}$('clear').onclick=reset;
async function init(){try{const r=await fetch('/firebase-config.json',{cache:'no-store'});if(!r.ok)throw Error('Firebase configuration not found');const config=await r.json();if(!config.apiKey||!config.projectId||!config.appId||!config.authDomain)throw Error('Firebase configuration is incomplete');const app=initializeApp(config);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user){$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');message('Sign in with your authorized admin account.');return}try{const role=await getDoc(doc(db,'admins',user.uid));if(!role.exists()){await signOut(auth);message('This account is not an authorized administrator.');return}$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');message('Signed in as admin.');await load()}catch(e){message('Admin verification failed: '+e.message)}})}catch(e){message('Setup required: '+e.message+'. Add Firebase Web App config to firebase-config.json.')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{message('Signing in…');await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){message(e.message)}};
$('signout').onclick=()=>signOut(auth);
async function load(){try{const snap=await getDocs(query(collection(db,'products'),limit(200)));items=snap.docs.map(d=>({id:d.id,...d.data()}));const list=$('list');list.replaceChildren();if(!items.length){list.textContent='No products yet.';return}for(const p of items){const row=document.createElement('div');row.className='item';const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=p.title;const small=document.createElement('small');small.textContent=' • '+p.retailer+' • '+(p.published?'Published':'Draft');info.append(strong,small);const actions=document.createElement('div');actions.className='actions';for(const [label,fn] of [['Edit',()=>edit(p)],['Delete',()=>remove(p)]]){const btn=document.createElement('button');btn.textContent=label;btn.type='button';btn.className=label==='Edit'?'secondary':'';btn.onclick=fn;actions.append(btn)}row.append(info,actions);list.append(row)}}catch(e){message('Unable to load products: '+e.message)}}
function edit(p){$('editId').value=p.id;$('title').value=p.title;$('category').value=p.category;$('retailer').value=p.retailer;$('price').value=p.price_inr??'';$('url').value=p.product_url;$('image').value=p.image_url??'';$('description').value=p.description??'';$('published').checked=!!p.published;window.scrollTo({top:0,behavior:'smooth'})}
async function remove(p){if(!confirm('Delete '+p.title+'?'))return;try{await deleteDoc(doc(db,'products',p.id));message('Deleted.');await load()}catch(e){message(e.message)}}
$('productForm').onsubmit=async e=>{e.preventDefault();const payload={title:$('title').value.trim(),category:$('category').value.trim(),retailer:$('retailer').value.trim(),price_inr:$('price').value?Number($('price').value):null,product_url:$('url').value.trim(),image_url:$('image').value.trim()||null,description:$('description').value.trim(),published:$('published').checked,updated_at:serverTimestamp()};try{const id=$('editId').value;if(id)await updateDoc(doc(db,'products',id),payload);else await addDoc(collection(db,'products'),{...payload,created_at:serverTimestamp()});reset();message('Product saved.');await load()}catch(e){message(e.message)}};
init();
</script></body></html>
